# release-plz: https://release-plz.dev/docs/config
#
# On each push to main, release-plz opens (or updates) a release PR that bumps
# the version and the changelog. Merging that PR publishes to crates.io and
# tags a GitHub release. Publishing needs the CARGO_REGISTRY_TOKEN secret,
# which isn't set: nothing is published until someone adds it, and nobody adds
# it without the maintainer's call.

[workspace]
# Publish only from a merged release PR, never from an ordinary push.
release_always = false
changelog_update = true
git_release_enable = true
git_tag_enable = true
# cargo-semver-checks against the last published version.
semver_check = true
pr_labels = ["release"]
pr_draft = false

# Two crates: tag each its own way. ccwire keeps the `v0.1.x` tags it has
# always had; ccwire-oauth gets `ccwire-oauth-v...` and its own changelog.
# Both are `publish = false` for now: flip them together.
[[package]]
name = "ccwire"
git_tag_name = "v{{ version }}"
git_release_name = "v{{ version }}"
changelog_path = "CHANGELOG.md"

[[package]]
name = "ccwire-oauth"
git_tag_name = "ccwire-oauth-v{{ version }}"
git_release_name = "ccwire-oauth-v{{ version }}"
changelog_path = "ccwire-oauth/CHANGELOG.md"
