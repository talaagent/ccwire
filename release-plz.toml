# release-plz: https://release-plz.dev/docs/config
#
# On each push to main, release-plz opens (or updates) a release PR that bumps
# the version and the changelog. Merging that PR publishes to crates.io and
# tags a GitHub release. Publishing needs the CARGO_REGISTRY_TOKEN secret,
# which isn't set: nothing is published until someone adds it, and nobody adds
# it without the maintainer's call.

[workspace]
# Publish only from a merged release PR, never from an ordinary push.
release_always = false
changelog_update = true
git_release_enable = true
git_tag_enable = true
# cargo-semver-checks against the last published version.
semver_check = true
pr_labels = ["release"]
pr_draft = false
