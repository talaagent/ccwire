# release-plz: release PRs on push to main, and crates.io publishing when one
# is merged (release-plz.toml).
#
# The private gate: every job has `if: ${{ !github.event.repository.private }}`.
# While the repo is private (where Actions minutes cost money) each job is
# skipped, and a skipped job uses no minutes. The day the repo is made public
# the condition turns true and the jobs run, with no further commit.
#
# Publishing also needs the CARGO_REGISTRY_TOKEN secret: without it the
# release job is skipped. It isn't set, so nothing is published until someone
# adds it (Ian's call).

name: release-plz

on:
  push:
    branches: [main]

permissions:
  contents: read

env:
  # Same pin as ci.yml (tala-agent's rust-toolchain.toml). Bump them together.
  RUST_TOOLCHAIN: "1.98.1"

jobs:
  release-pr:
    name: release PR
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: release-plz-pr-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      # dtolnay/rust-toolchain master @ 2026-10-16; installs env.RUST_TOOLCHAIN (1.98.1)
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: release-plz/action@v0.5
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # A job's `if` can't read `secrets`, so this job turns "is the secret set"
  # into an output (true/false, never the value) for `release` to gate on.
  has-token:
    name: CARGO_REGISTRY_TOKEN set?
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    outputs:
      set: ${{ steps.check.outputs.set }}
    steps:
      - id: check
        env:
          IS_SET: ${{ secrets.CARGO_REGISTRY_TOKEN != '' }}
        run: |
          echo "set=$IS_SET" >> "$GITHUB_OUTPUT"
          if [ "$IS_SET" != true ]; then
            echo "::notice::No CARGO_REGISTRY_TOKEN secret: publishing is skipped."
          fi

  release:
    name: publish
    needs: has-token
    if: ${{ !github.event.repository.private && needs.has-token.outputs.set == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # One publish at a time; never cancel one halfway through.
    concurrency:
      group: release-plz-release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      # dtolnay/rust-toolchain master @ 2026-10-16; installs env.RUST_TOOLCHAIN (1.98.1)
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      # Publishes only the versions crates.io doesn't have yet, i.e. after a
      # release PR is merged; otherwise it does nothing.
      - uses: release-plz/action@v0.5
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
