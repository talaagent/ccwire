# Protocol drift against the newest Claude Code CLI on npm.
#
# The private gate: every job has `if: ${{ !github.event.repository.private }}`.
# While the repo is private (where Actions minutes cost money) each job is
# skipped, and a skipped job uses no minutes. The day the repo is made public
# the condition turns true and the jobs run, with no further commit.
#
# Without credentials it checks that:
# - `claude --version` matches ccwire::TESTED_CLI_VERSION (a warning only:
#   the CLI ships weekly, so this is expected to drift between corpus updates);
# - every flag Options::to_argv can emit still appears in `claude --help`.
# With an ANTHROPIC_API_KEY secret it also runs one short live turn. It never
# prints the key. A failed scheduled run opens (or comments on) one issue.

name: Newest CLI

on:
  schedule:
    # Mondays, 06:17 UTC.
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drift:
    name: drift vs newest claude
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    env:
      # Whether the secret exists, as 'true' or 'false' (never its value).
      HAS_ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - name: Install the newest @anthropic-ai/claude-code
        run: |
          npm install -g @anthropic-ai/claude-code@latest
          claude --version

      - name: Compare the CLI version with TESTED_CLI_VERSION
        run: |
          tested=$(sed -n 's/^pub const TESTED_CLI_VERSION: &str = "\(.*\)";/\1/p' crates/ccwire/src/lib.rs)
          newest=$(claude --version | awk '{print $1}')
          if [ -z "$tested" ]; then
            echo "::error::no TESTED_CLI_VERSION in crates/ccwire/src/lib.rs"
            exit 1
          fi
          {
            echo "### Claude Code CLI"
            echo "- newest on npm: \`$newest\`"
            echo "- TESTED_CLI_VERSION: \`$tested\`"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$newest" != "$tested" ]; then
            echo "::warning::claude $newest differs from TESTED_CLI_VERSION $tested; re-record the corpus (crates/ccwire/tests/corpus)"
          fi

      - name: Check that every to_argv flag is in claude --help
        run: |
          claude --help > "$RUNNER_TEMP/claude-help.txt"
          python3 .github/scripts/check_cli_flags.py crates/ccwire/src/options.rs "$RUNNER_TEMP/claude-help.txt"

      # Only with the secret: a skipped step costs nothing and needs no key.
      - name: Live turn (needs ANTHROPIC_API_KEY)
        if: ${{ env.HAS_ANTHROPIC_API_KEY == 'true' }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          out="$RUNNER_TEMP/live.jsonl"
          claude -p --output-format stream-json --verbose --max-turns 1 \
            --tools "" --no-session-persistence -- "Reply with the word ok." > "$out"
          # Print only the frame types, never the frames (or the environment).
          jq -r '.type + (if .subtype then "/" + .subtype else "" end)' "$out" | sort | uniq -c
          jq -e -s 'any(.[]; .type == "system" and .subtype == "init")' "$out" > /dev/null \
            || { echo "::error::no system/init frame"; exit 1; }
          jq -e -s 'any(.[]; .type == "result")' "$out" > /dev/null \
            || { echo "::error::no result frame"; exit 1; }
      - name: Live turn skipped
        if: ${{ env.HAS_ANTHROPIC_API_KEY != 'true' }}
        run: echo "No ANTHROPIC_API_KEY secret; the live turn was skipped."

  report:
    name: open or update the drift issue
    needs: drift
    if: ${{ !github.event.repository.private && failure() && github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open or comment on the issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Newest Claude Code CLI check failed"
          body="The scheduled newest-CLI check failed: $RUN_URL"
          number=$(gh issue list --state open --search "in:title \"$title\"" \
            --json number,title --jq "map(select(.title == \"$title\")) | .[0].number // empty")
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
