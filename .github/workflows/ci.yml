# CI: fmt, clippy, tests, MSRV, docs, cargo-deny and nix flake check.
#
# The private gate: every job has `if: ${{ !github.event.repository.private }}`.
# While the repo is private (where Actions minutes cost money) each job is
# skipped, and a skipped job uses no minutes. The day the repo is made public
# the condition turns true and the jobs run, with no further commit.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # The toolchain the crate is developed against. Bump it with
  # release.yml's.
  RUST_TOOLCHAIN: "1.98.1"

jobs:
  fmt:
    name: rustfmt
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # dtolnay/rust-toolchain master @ 2026-10-16; installs env.RUST_TOOLCHAIN (1.98.1)
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: clippy (${{ matrix.features.name }})
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        features:
          - { name: default, flags: "" }
          - { name: all-features, flags: "--all-features" }
    steps:
      - uses: actions/checkout@v7
      # dtolnay/rust-toolchain master @ 2026-10-16; installs env.RUST_TOOLCHAIN (1.98.1)
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.features.name }}
      - run: cargo clippy --workspace --all-targets --locked ${{ matrix.features.flags }} -- -D warnings
      # Each crate's library on its own: over the workspace, feature
      # unification turns on other crates' tokio (and other) features, so a
      # feature a crate uses but doesn't declare would still build.
      - run: cargo clippy -p ccwire --lib ${{ matrix.features.flags }} -- -D warnings
      - run: cargo clippy -p ccwire-oauth --lib ${{ matrix.features.flags }} -- -D warnings
      - run: cargo clippy -p ccwire-settings --lib ${{ matrix.features.flags }} -- -D warnings

  test:
    name: test (${{ matrix.features.name }})
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        features:
          - { name: default, flags: "" }
          # `runtime` adds the framing's async half and the session tests
          # over the fake CLI (crates/ccwire/tests/fake_claude).
          - { name: all-features, flags: "--all-features" }
    steps:
      - uses: actions/checkout@v7
      # dtolnay/rust-toolchain master @ 2026-10-16; installs env.RUST_TOOLCHAIN (1.98.1)
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.features.name }}
      # Includes crates/ccwire/tests/corpus.rs, the golden corpus test.
      - uses: taiki-e/install-action@nextest
      - run: cargo nextest run --profile ci --workspace --all-targets --locked ${{ matrix.features.flags }}
      - run: cargo test --workspace --doc --locked ${{ matrix.features.flags }}

  msrv:
    name: MSRV
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Read rust-version from Cargo.toml
        id: msrv
        run: |
          # One MSRV, the root's [workspace.package] rust-version, which
          # every crate inherits.
          for manifest in crates/*/Cargo.toml; do
            if ! grep -Eq '^rust-version\.workspace *= *true' "$manifest"; then
              echo "::error::$manifest doesn't inherit rust-version (rust-version.workspace = true)"
              exit 1
            fi
          done
          msrv=$(sed -n 's/^rust-version *= *"\(.*\)"/\1/p' Cargo.toml)
          if [ -z "$msrv" ]; then
            echo "::error::no rust-version = \"...\" in Cargo.toml's [workspace.package]"
            exit 1
          fi
          echo "MSRV: $msrv"
          echo "version=$msrv" >> "$GITHUB_OUTPUT"
      # Re-resolve Cargo.lock (it is pinned for the current toolchain) with a current cargo, whose
      # rust-version-aware resolver (resolver 3, edition 2024) picks
      # dependency versions that still build on the MSRV.
      # dtolnay/rust-toolchain master @ 2026-10-16; installs env.RUST_TOOLCHAIN (1.98.1)
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - run: cargo generate-lockfile
      # dtolnay/rust-toolchain master @ 2026-10-16; installs the MSRV (rust-version)
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@v2
      # Every crate in the workspace (they inherit the root's rust-version).
      - run: cargo +${{ steps.msrv.outputs.version }} build --workspace --all-features --locked
      - run: cargo +${{ steps.msrv.outputs.version }} build --workspace --locked

  doc:
    name: docs
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v7
      # dtolnay/rust-toolchain master @ 2026-10-16; installs env.RUST_TOOLCHAIN (1.98.1)
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --workspace --no-deps --all-features

  deny:
    name: cargo-deny
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Licenses (permissive only), advisories, bans and sources, over every
      # feature: see deny.toml.
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  nix:
    name: nix flake check
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      # Builds and tests the workspace (every feature) in the Nix sandbox,
      # with nixpkgs' Rust, and evaluates the dev shell.
      - run: nix flake check -L
