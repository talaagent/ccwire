[package]
name = "claude-code-settings"
description = "Typed Claude Code settings.json: every key, lossless round-trips, and Claude Code's layer merge"
version = "0.1.1"
edition.workspace = true
license.workspace = true
readme = "README.md"
repository.workspace = true
documentation = "https://docs.rs/claude-code-settings"
authors.workspace = true
rust-version.workspace = true
keywords = ["claude", "claude-code", "settings", "config", "serde"]
categories = ["config", "development-tools"]
# The schema copy and the fixtures stay in the repository; the tests that
# read them go with them.
exclude = ["schema", "tests"]

[dependencies]
serde.workspace = true
serde_json.workspace = true

# missing_docs is warned in src/lib.rs (#![warn(missing_docs)]).
[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
