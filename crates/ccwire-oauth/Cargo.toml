[package]
name = "ccwire-oauth"
description = "A typed async client for the Claude account endpoints an OAuth login can call"
version = "0.1.1"
edition.workspace = true
license.workspace = true
readme = "README.md"
repository.workspace = true
documentation = "https://docs.rs/ccwire-oauth"
authors.workspace = true
rust-version.workspace = true
keywords = ["claude", "oauth", "usage", "api-client"]
categories = ["api-bindings"]
# The recorded fixtures stay in the repo; the tests that include_str! them
# go with them.
exclude = ["tests"]

[dependencies]
httpdate.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# Only tokio::spawn, for refresh_and_store; reqwest already runs on tokio.
tokio = { workspace = true, features = ["rt"] }
url.workspace = true
zeroize.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros", "sync"] }
wiremock.workspace = true

# missing_docs is warned in src/lib.rs (#![warn(missing_docs)]).
[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
