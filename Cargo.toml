# ccwire: a Rust SDK for Claude Code. `ccwire` is the stream-json protocol
# and session core, `ccwire-oauth` a client for the Claude account endpoints
# an OAuth login can call, `claude-code-settings` Claude Code's settings.json as
# types. Each crate keeps its own version, README and
# exclude list; the rest is shared here.
[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/talaagent/ccwire"
authors = ["Ian Macalinao <github@igm.pub>"]
# The MSRV of every crate (CI's `msrv` job reads it from here).
rust-version = "1.85"

# Each crate turns on the features it uses (`features = [...]` beside
# `workspace = true`); the entries here only pin versions and turn default
# features off where a crate wants them off.
[workspace.dependencies]
httpdate = "1.0.3"
# reqwest's default TLS is rustls (aws-lc-rs provider, the platform's
# roots); http2 for the API, no system proxy lookup, no cookies.
reqwest = { version = "0.13.5", default-features = false, features = [
    "rustls",
    "http2",
    "charset",
] }
serde = { version = "1.0.229", features = ["derive"] }
# serde_json without `preserve_order` or `float_roundtrip`: frames compare
# as `Value`s, so key order and the last float digit don't matter.
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", default-features = false }
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
url = "2.5.8"
wiremock = "0.6.5"
zeroize = "1.9.1"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
complexity = { level = "deny", priority = -1 }
must_use_candidate = "allow"
struct_excessive_bools = "allow"
needless_pass_by_value = "allow"
unnecessary_wraps = "allow"
unwrap_used = "deny"
std_instead_of_alloc = "deny"
std_instead_of_core = "deny"
cognitive_complexity = "deny"
too_many_lines = "deny"
clone_on_ref_ptr = "deny"
# No lock guard across an await; the blocking calls clippy.toml lists are
# off limits outside tests.
await_holding_lock = "deny"
disallowed_methods = "deny"
disallowed_types = "deny"
large_futures = "allow"
