[package]
name = "ccwire"
description = "A Rust SDK for Claude Code: the stream-json protocol, typed"
version.workspace = true
edition.workspace = true
# Its own, not the workspace's: the crate is meant to move to its own repo.
license = "MIT OR Apache-2.0"
repository = "https://github.com/macalinao/ccwire"
authors = ["Ian Macalinao <github@igm.pub>"]
rust-version.workspace = true
publish.workspace = true
keywords = ["claude", "claude-code", "agent", "sdk"]
categories = ["api-bindings"]
# The golden corpus (and scrub.py, its tool) stays in the repo; its test
# goes with it, as it include_str!s the corpus.
exclude = ["tests/corpus", "tests/corpus.rs"]

[features]
default = []
# The async layers over tokio: the framing's async reader and writer, and
# the session core. The `protocol` module and the sync framing never need it.
runtime = ["dep:tokio"]

# Declared here rather than inherited: the workspace's serde_json turns on
# `preserve_order` and `float_roundtrip`, which ccwire doesn't need (frames
# compare as `Value`s, so key order and the last float digit don't matter).
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# Only what the session core uses: async I/O traits and buffering (io-util),
# its channels (sync) and its reader/writer tasks (rt). Not the workspace's
# tokio, which turns on most of tokio.
tokio = { version = "1", default-features = false, features = [
    "io-util",
    "sync",
    "rt",
], optional = true }

[dev-dependencies]
# The tests' runtimes (current-thread and multi-thread) and their hang
# guard.
tokio = { version = "1", default-features = false, features = [
    "io-util",
    "sync",
    "rt",
    "rt-multi-thread",
    "macros",
    "time",
] }

[lints]
workspace = true
